<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZERO CHILL 3.0 – Ultimate AI Cybersecurity, Cybercrime Prevention & Legal Action Platform</title>
  <meta name="description" content="AI-powered Indian Cyber Safety, Cybercrime Prevention, Digital Evidence Management & Legal Action Platform.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#070d1b',
              panel: '#0f172a',
              cyan: '#06b6d4',
              blue: '#3b82f6',
              danger: '#ef4444',
              warning: '#f59e0b',
              safe: '#10b981'
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.3s ease-out forwards',
            pulseSlow: 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX parsing -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tesseract.js for Client-Side OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-[#070d1b] text-slate-100 min-h-screen">
  <!-- React App Root Container -->
  <div id="root">
    <!-- Initial Loader before React Mounts -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-[#070d1b] text-center space-y-4">
      <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-500 p-0.5 shadow-xl shadow-cyan-500/20 animate-pulse">
        <div className="w-full h-full bg-[#070d1b] rounded-[14px] flex items-center justify-center">
          <svg className="w-8 h-8 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
      </div>
      <h2 class="text-xl font-extrabold text-white font-mono">
        ZERO CHILL<span class="text-cyan-400"> 3.0</span>
      </h2>
      <p class="text-xs text-slate-400 font-mono">
        Initializing AI Cyber Safety & Legal Action Platform...
      </p>
    </div>
  </div>

  <!-- Application Logic Scripts -->
  <script src="/static/js/data/samples.js"></script>
  <script src="/static/js/utils/localAnalyzer.js"></script>
  <script type="text/babel" src="/static/js/app.jsx"></script>
</body>
</html>
